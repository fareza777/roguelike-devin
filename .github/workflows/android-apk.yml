name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [claude/charming-bardeen-13d6ua]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: dreadmarch-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dreadmarch-debug.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest dreadmarch-debug.apk --prerelease --title "Dreadmarch debug APK" --notes "Debug build from ${{ github.sha }}. Uses Google test ads."
